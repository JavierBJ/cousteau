<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travel Inspiration — PoC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bg-transparent py-6 px-6 md:px-12 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <div class="rounded-full bg-slate-100 p-2 backdrop-blur-sm border border-slate-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2v4m6.36 1.64L16 8m4 4h-4M7.64 3.64L8 8M2 12h4m1.64 6.36L8 16M12 22v-4m6.36-1.64L16 16" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold" style="font-family:Inter,ui-sans-serif">Travel Inspiration</h1>
        <p class="text-sm text-slate-600 -mt-1">Daily micro-stories to spark your next trip</p>
      </div>
    </div>
    <nav class="flex gap-3">
      <button id="nav-history" title="See past history" aria-label="Toggle history" class="w-10 h-10 flex items-center justify-center bg-white rounded-md shadow-sm hover:bg-sky-50 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7zM7 7v10M17 7v10" />
        </svg>
      </button>
    </nav>
  </header>

  <main class="min-h-screen flex items-start justify-center px-6">
    <div class="w-full max-w-5xl flex gap-6">
      <div class="flex-1">
        <section id="view-today" class="view">
          <div id="card" class="relative p-8 rounded-3xl glass-card shadow-lg transform transition-all duration-500 hover:-translate-y-1">
          <div class="flex items-center justify-between">
            <div>
              <h2 id="card-country" class="text-3xl md:text-4xl font-bold leading-tight text-slate-900">—</h2>
              <p id="card-category" class="text-sm text-slate-600 mt-1"></p>
            </div>
            <div class="text-right">
              <button id="generate-btn" class="inline-flex items-center gap-3 bg-sky-600 text-white font-semibold px-4 py-2 rounded-full shadow hover:scale-105 transition">Generate</button>
            </div>
          </div>
          <p id="card-fact" class="mt-8 text-lg md:text-xl text-slate-800 leading-relaxed">Select countries in Settings to start.</p>
          <div id="link-previews" class="link-previews mt-6"></div>
        </div>
        </section>

        <section id="view-settings" class="view mt-8">
          <div class="p-6 rounded-2xl glass-card">
          <h2 class="text-xl font-semibold mb-3">Settings</h2>
          <form id="countries-form">
            <label class="text-sm text-slate-700 block mb-2">Select countries (3-5). Type to search and press Enter to add:</label>
            <div id="countries-tag-input" class="tags-input bg-white p-3 rounded-xl border border-slate-200">
              <ul id="tags-list" class="tags-list flex flex-wrap gap-2 m-0 p-0"></ul>
              <input id="countries-input" class="tag-input bg-transparent outline-none text-slate-800" placeholder="Type to add countries..." autocomplete="off" />
            </div>
            <div id="suggestions" class="suggestions hidden mt-2"></div>
            <div class="row mt-4 flex gap-3">
              <button type="submit" class="px-4 py-2 rounded-xl bg-sky-600 text-white font-semibold">Save</button>
              <button type="button" id="clear-storage" class="px-4 py-2 rounded-xl bg-white border border-slate-200">Reset</button>
            </div>
          </form>
          </div>
        </section>
      </div>

      <aside id="history-panel" class="w-72 hidden">
        <div class="p-4">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-lg font-semibold">History</h3>
            <button id="close-history" class="text-sm text-slate-600">Close</button>
          </div>
          <div id="history-list" class="space-y-3"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
